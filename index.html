<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALQUIPC - Sistema de Facturación</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-container">
    <!-- Formulario de Entrada de Datos -->
    <div class="card form-card">
      <h2>ALQUIPC - Facturación de Servicios</h2>
      <form id="factura-form">

        <div class="form-group">
          <label for="cliente">Nombre del Cliente:</label>
          <input type="text" id="cliente" required placeholder="Ej: Juan Pérez">
        </div>

        <div class="form-group">
          <label for="idCliente">ID Cliente:</label>
          <input type="text" id="idCliente" required placeholder="Ej: 1001">
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono:</label>
          <input type="tel" id="telefono" required placeholder="Ej: 3001234567">
        </div>

        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" required placeholder="correo@ejemplo.com">
        </div>

        <div class="form-group">
          <label for="tipoServicio">Tipo de servicio:</label>
          <select id="tipoServicio" required>
            <option value="Dentro de la ciudad">Dentro de la ciudad</option>
            <option value="Fuera de la ciudad">Fuera de la ciudad (+5% recargo)</option>
            <option value="Dentro del establecimiento">Dentro del establecimiento (-5% desc.)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="numEquipos">Número de Equipos (Mínimo 2):</label>
          <input type="number" id="numEquipos" min="2" value="2" required>
        </div>

        <div class="form-group">
          <label for="diasIniciales">No. Días Iniciales:</label>
          <input type="number" id="diasIniciales" min="1" value="1" required>
        </div>

        <div class="form-group">
          <label for="diasAdicionales">No. Días Adicionales:</label>
          <input type="number" id="diasAdicionales" min="0" value="0" required>
        </div>

        <button type="submit" class="btn">Generar Factura</button>
      </form>
    </div>

    <!-- Terminal de Salida / Factura -->
    <div class="card terminal-card">
      <div class="terminal-header">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="title">Consola de Facturación</span>
      </div>
      <pre id="output-terminal">Esperando la generación de la factura...</pre>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
